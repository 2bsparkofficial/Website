<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04091b">
<title>2B SPARK | Direct LED Bulb Manufacturer</title>
<meta name="description" content="2B SPARK - We make the bulbs. We bring the brightness. Direct LED bulb manufacturer. Bulk orders from 100 pieces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Logo file: images/logo.png (next to this file) */
:root{--navy:#04091b;--navy2:#0a1d44;--blue:#4da3ff;--blue2:#2f7bf5;--spark:#ffc933;--gold:#e0b95a;--ink:#0b1730;--bg:#f4f7fc;--line:#e1e8f3;--muted:#5a6a86;--soft:#a9b9d3;--m:224px;--R:160px;--t:56px;--hh:64px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:'Inter','Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:94px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Manrope','Noto Sans Devanagari',sans-serif}
html[lang=hi] *,html[lang=mr] *{font-family:'Noto Sans Devanagari','Inter',sans-serif!important;letter-spacing:0!important}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}img{display:block}

/* HEADER */
header.top{position:sticky;top:0;z-index:60;height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:rgba(4,9,27,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06);transition:background .4s,border-color .4s}
header.top.sc{background:rgba(4,9,27,.97);border-bottom-color:rgba(77,163,255,.25)}
.logo{display:flex;align-items:center;height:40px;flex:none}
.logo img{height:100%;width:auto;object-fit:contain}
.nav{display:none;gap:26px;font-size:.84rem;font-weight:500;color:var(--soft)}
.nav a{position:relative;padding:6px 0;transition:color .25s;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--blue);transition:width .3s}
.nav a:hover{color:#fff}.nav a:hover::after{width:100%}
.hr{display:flex;align-items:center;gap:8px}
.lang{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--soft);font:600 .74rem 'Inter',sans-serif;padding:7px 10px;border-radius:99px;transition:.25s;line-height:1}
.lang button.on{background:#fff;color:var(--navy)}
.hcall{font-weight:600;font-size:.8rem;color:var(--navy);background:#fff;padding:10px 14px;border-radius:8px;transition:.25s;white-space:nowrap}
.hcall:hover{background:var(--spark);transform:translateY(-1px)}
.hcall .cd{display:none}
.ltoast{position:fixed;top:calc(var(--hh) + 10px);left:50%;transform:translate(-50%,-20px);z-index:80;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 18px 44px rgba(4,9,27,.3);padding:12px 14px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:.5s cubic-bezier(.2,.8,.2,1);width:max-content;max-width:calc(100vw - 24px)}
.ltoast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ltoast span{font-size:.78rem;color:var(--muted);font-weight:500}
.ltoast button{border:1px solid var(--line);background:var(--bg);border-radius:99px;font-weight:600;font-size:.78rem;padding:7px 12px;color:var(--navy2)}
.ltoast button:hover{background:var(--navy2);color:#fff}

/* HERO */
.hero{position:relative;color:#fff;padding:30px 18px 44px;overflow:hidden;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 60% 45%,#000,transparent 72%);mask-image:radial-gradient(circle at 60% 45%,#000,transparent 72%);animation:grid 22s linear infinite}
@keyframes grid{to{background-position:46px 46px}}
.blob{position:absolute;right:-120px;top:-80px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(47,123,245,.45),transparent 65%);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.15)}}
.hero-in{position:relative;max-width:1120px;margin:auto}
.chip2{display:inline-flex;align-items:center;gap:9px;font-size:.68rem;font-weight:600;letter-spacing:.2em;color:var(--blue);border:1px solid rgba(77,163,255,.4);background:rgba(77,163,255,.08);padding:8px 14px;border-radius:99px}
.chip2 svg{width:12px;height:14px;fill:var(--spark)}
.hero h1{font-size:clamp(1.7rem,7vw,3.3rem);line-height:1.12;font-weight:800;letter-spacing:-.01em;margin:18px 0 12px}
.ln{display:block;overflow:hidden;padding-bottom:.1em}
.ln>span{display:block;transform:translateY(115%);animation:up 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.2s + .15s*var(--i))}
@keyframes up{to{transform:none}}
.acc{background:linear-gradient(90deg,#fff,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.sl{font-family:'Manrope';font-weight:700;color:var(--spark);letter-spacing:.06em;font-size:.95rem;margin-bottom:12px;opacity:0;animation:fade .8s .8s forwards}
.mm{font-family:'Manrope';font-weight:800;font-size:1.05rem;color:#fff;margin:0 0 10px;padding-left:12px;border-left:3px solid var(--spark);opacity:0;animation:fade .8s .9s forwards}
.lead{color:var(--soft);line-height:1.7;font-size:.97rem;max-width:520px;opacity:0;animation:fade .8s 1s forwards}
@keyframes fade{to{opacity:1}}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;opacity:0;animation:fade .8s 1.2s forwards}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:10px;font-weight:600;font-size:.88rem;border:1px solid transparent;transition:.3s;text-align:center}
.btn.pr{background:var(--blue2);color:#fff;box-shadow:0 10px 26px rgba(47,123,245,.4)}.btn.pr:hover{background:#4a8dff;transform:translateY(-2px)}
.btn.gh{border-color:rgba(255,255,255,.28);color:#fff}.btn.gh:hover{background:rgba(255,255,255,.1)}

/* SHOWCASE */
.stage{--cy:calc(var(--R)*.97 + 58px);position:relative;height:calc(var(--cy) + var(--m)/2 + 24px);max-width:420px;margin:26px auto 0;overflow:hidden}
.glow{position:absolute;left:50%;top:var(--cy);width:calc(var(--m)*2);height:calc(var(--m)*2);margin:calc(var(--m)*-1) 0 0 calc(var(--m)*-1);background:radial-gradient(circle,rgba(47,123,245,.4),transparent 62%);pointer-events:none}
.ring{position:absolute;left:50%;top:var(--cy);width:calc(var(--R)*2);height:calc(var(--R)*2);margin:calc(var(--R)*-1) 0 0 calc(var(--R)*-1);border:1px dashed rgba(255,255,255,.26);border-radius:50%;transform:scale(.55);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s;pointer-events:none}
.open .ring{transform:none;opacity:1}
.mw{position:absolute;left:50%;top:var(--cy);width:var(--m);height:var(--m);margin:calc(var(--m)/-2) 0 0 calc(var(--m)/-2);z-index:3;transition:transform .7s cubic-bezier(.2,.9,.3,1.15)}
.open .mw{transform:translateY(-6px) scale(1.04)}
.pulse{position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(255,255,255,.6);animation:pulse 2.8s ease-out infinite;pointer-events:none}
.open .pulse{animation:none;opacity:0}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.25);opacity:0}}
.main{position:absolute;inset:0;border-radius:50%;overflow:hidden;cursor:grab;touch-action:pan-y;background:radial-gradient(circle at 50% 28%,#2a64c4 0%,#12306b 45%,#060e26 100%);border:2px solid rgba(255,255,255,.92);box-shadow:0 22px 60px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.35);transition:box-shadow .6s}
.open .main{box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 8px rgba(255,255,255,.07),inset 0 0 40px rgba(0,0,0,.35)}
.main:active{cursor:grabbing}
.main canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s,transform .3s}
.main.swap canvas{opacity:0;transform:scale(.82) rotate(-8deg)}
.b360{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(4,9,27,.72);border:1px solid rgba(255,255,255,.22);color:#fff;font:700 .68rem 'Manrope';letter-spacing:.08em;padding:5px 11px;border-radius:99px;pointer-events:none}
.b360 svg{width:13px;height:13px;animation:rot 3s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.plus{position:absolute;right:-2px;top:6px;width:32px;height:32px;border-radius:50%;background:var(--blue2);color:#fff;display:grid;place-items:center;font-size:1.25rem;line-height:1;border:3px solid #fff;z-index:4;pointer-events:none;transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.open .plus{transform:rotate(45deg)}
.fan{position:absolute;inset:0;pointer-events:none}
.fi{position:absolute;left:50%;top:var(--cy);width:var(--t);height:var(--t);margin:calc(var(--t)/-2) 0 0 calc(var(--t)/-2);padding:0;background:none;border:0;transform:scale(.2);opacity:0;pointer-events:none;transition:transform .7s cubic-bezier(.2,.9,.3,1.25) var(--d),opacity .4s var(--d);z-index:2}
.open .fi{transform:translate(calc(var(--x)*var(--R)),calc(var(--y)*var(--R)));opacity:1;pointer-events:auto}
.open .fi:hover{transform:translate(calc(var(--x)*var(--R)),calc(var(--y)*var(--R))) scale(1.12)}
.th{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.92);background:radial-gradient(circle at 50% 28%,#2a64c4,#12306b 50%,#060e26);box-shadow:0 10px 24px rgba(0,0,0,.45);font:800 .9rem 'Manrope';color:#fff}
.th img{width:100%;height:100%;object-fit:contain}
.fi em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:7px;font-style:normal;font-size:.66rem;font-weight:500;color:#dbe6f7;white-space:nowrap}
.pname{text-align:center;color:#fff;font:700 .95rem 'Manrope';margin-top:10px;min-height:1.3em}
.ctl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;font-size:.74rem;color:var(--soft);flex-wrap:wrap}
.lit{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:.74rem;font-weight:600;padding:7px 13px;border-radius:99px;transition:.25s}
.lit i{width:8px;height:8px;border-radius:50%;background:#556;transition:.3s}
.lit.on i{background:var(--spark);box-shadow:0 0 10px var(--spark)}
.lit:hover{background:rgba(255,255,255,.14)}

/* SECTIONS */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*80ms)}
.rv.in{opacity:1;transform:none}
.sec{max-width:1120px;margin:0 auto;padding:68px 18px 0}
#contact{padding-bottom:36px}
.sh small{font-size:.68rem;font-weight:600;letter-spacing:.22em;color:var(--blue2);display:block}
.sh h2{font-size:clamp(1.55rem,5.6vw,2.4rem);line-height:1.2;margin:10px 0 12px;font-weight:800;letter-spacing:-.02em;max-width:680px}
.sh p{color:var(--muted);line-height:1.7;font-size:.95rem;max-width:620px}

/* why: stacking cards */
.whywrap{display:block}
.stack{margin-top:22px;padding-bottom:24px}
.sk{position:sticky;top:calc(var(--hh) + 14px + var(--i)*11px);height:112px;margin-bottom:-26px;z-index:calc(var(--i) + 1)}
.sk:last-child{margin-bottom:0}
.ski{height:100%;border-radius:20px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;background:var(--c);border:1px solid rgba(255,255,255,.14);box-shadow:0 -10px 26px rgba(4,9,27,.28);color:#fff;transform-origin:50% 0;transition:transform .3s,filter .3s;will-change:transform}
.ski .n{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:800 .78rem 'Manrope'}
.ski h3{font-size:1rem;font-weight:700;margin-bottom:4px;line-height:1.3}
.ski p{font-size:.85rem;color:#c3d2ea;line-height:1.5}

/* catalogue */
.seg{display:inline-flex;background:#e6edf8;border-radius:99px;padding:4px;margin-top:22px}
.seg button{border:0;background:none;padding:10px 22px;border-radius:99px;font-weight:600;font-size:.86rem;color:var(--muted);transition:.3s}
.seg button.on{background:var(--navy2);color:#fff;box-shadow:0 6px 16px rgba(10,29,68,.3)}
.pgrid{display:grid;gap:16px;margin-top:20px}
.pc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px rgba(8,22,48,.06);animation:rise .6s both;animation-delay:calc(var(--i)*70ms);transition:transform .35s,box-shadow .35s}
.pc:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(10,29,68,.14)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.pt{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pth{width:74px;height:74px;flex:none}
.pt h3{font-size:.98rem;line-height:1.3;font-weight:700}
.pt small{display:block;font-size:.62rem;font-weight:600;letter-spacing:.16em;color:var(--blue2);margin-bottom:4px}
.tbl .r{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:.92rem;align-items:center}
.tbl .r.h{border-top:0;border-bottom:1px solid var(--ink);padding:8px 0;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.c2{grid-template-columns:1fr auto}.c3{grid-template-columns:.7fr 1fr auto}
.pr2{font-family:'Manrope';font-weight:800;text-align:right;font-size:1rem}
.h .pr2{font-family:'Inter';font-weight:600;color:var(--muted);font-size:.64rem}
.v360{margin-top:14px;width:100%;border:1px solid var(--line);background:#f4f8ff;color:var(--navy2);font-weight:600;font-size:.84rem;padding:12px;border-radius:12px;transition:.25s}
.v360:hover{background:var(--navy2);color:#fff;border-color:var(--navy2)}

/* PROMISE */
.promise{position:relative;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);border-radius:26px;padding:12px;box-shadow:0 30px 70px rgba(4,9,27,.35)}
.pm-frame{position:relative;border:1px solid rgba(224,185,90,.55);border-radius:18px;padding:64px 22px 30px;text-align:center;overflow:hidden}
.pm-frame::before{content:"";position:absolute;inset:5px;border:1px solid rgba(224,185,90,.22);border-radius:14px;pointer-events:none}
.pm-frame::after{content:"";position:absolute;left:50%;top:-90px;width:320px;height:320px;margin-left:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,51,.18),transparent 65%);pointer-events:none}
.seal{position:absolute;left:50%;top:-1px;width:96px;height:96px;margin:-48px 0 0 -48px;z-index:2;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.seal .spin{transform-origin:60px 60px;animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pm-frame small{position:relative;font-size:.68rem;font-weight:600;letter-spacing:.24em;color:var(--gold)}
.pm-frame h3{position:relative;color:#fff;font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.22;margin:12px 0 6px;font-weight:800}
.pm-l{position:relative;color:var(--soft);font-size:.9rem;margin-bottom:22px}
.pledge{position:relative;list-style:none;text-align:left;width:max-content;max-width:100%;margin:0 auto;display:grid;gap:14px}
.pledge li{display:flex;gap:14px;align-items:center;color:#fff;font-weight:600;font-size:.98rem;line-height:1.4;opacity:0;transform:translateX(-14px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(.5s + var(--k)*.3s)}
.promise.in .pledge li{opacity:1;transform:none}
.pledge svg{flex:none;width:28px;height:28px}
.pledge circle{fill:rgba(224,185,90,.08);stroke:var(--gold);stroke-width:1.6}
.pledge path{fill:none;stroke:var(--spark);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .6s ease;transition-delay:calc(.85s + var(--k)*.3s)}
.promise.in .pledge path{stroke-dashoffset:0}
.pm-end{position:relative;margin-top:26px;padding-top:20px;border-top:1px solid rgba(224,185,90,.3);color:#fff;font:800 .8rem 'Manrope';letter-spacing:.18em;line-height:2}
.pm-end b{display:block;font-weight:800}.pm-end b:last-child{color:var(--spark)}
.sign{position:relative;margin-top:16px;font-family:Georgia,'Times New Roman',serif;font-style:italic;color:var(--gold);font-size:1.05rem}

/* contact */
.cards{display:grid;gap:14px;margin-top:24px}
.cc{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}
.cc small{font-size:.64rem;letter-spacing:.18em;color:var(--muted);font-weight:600}
.cc h3{font-size:1.15rem;margin:6px 0 12px;font-weight:800}
.cc .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.cc .row b.t{font-family:'Manrope';font-weight:700;font-size:1.05rem}
.cc .row.st{flex-direction:column;align-items:stretch;padding-top:6px}
.acts{display:flex;gap:8px;flex:none}
.row.st .acts{width:100%}.row.st .cb{flex:1;text-align:center}
.cb{font-weight:600;font-size:.82rem;padding:11px 18px;border-radius:99px;transition:.25s;white-space:nowrap;text-align:center}
.cb.call{background:var(--navy2);color:#fff}.cb.call:hover{background:var(--blue2)}
.cb.wa{background:#1c9a58;color:#fff}.cb.wa:hover{background:#22b368}

/* dock */
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:70;display:flex;gap:8px;background:rgba(4,9,27,.94);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px;box-shadow:0 14px 34px rgba(4,9,27,.4)}
.dock a{flex:1;text-align:center;padding:13px 6px;border-radius:9px;font-weight:600;font-size:.88rem;transition:.25s}
.dock .c{background:#fff;color:var(--navy)}.dock .w{background:#1c9a58;color:#fff}
.dock a:active{transform:scale(.97)}

/* DESKTOP */
@media(min-width:760px){
  .nav{display:flex}.logo{height:48px}
  .hcall .cn{display:none}.hcall .cd{display:inline}
  header.top{padding:0 22px}
  .pgrid{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:repeat(3,1fr)}
  .pm-frame{padding:70px 48px 38px}
  .pledge{grid-template-columns:repeat(2,auto);justify-content:center;gap:22px 56px}
}
@media(min-width:960px){
  :root{--m:310px;--R:222px;--t:74px}
  .hero{padding:70px 28px 70px}
  .hero-in{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:30px}
  .stage{max-width:580px;margin-top:0}
  .dock{display:none}body{padding-bottom:0}
  .pgrid{grid-template-columns:repeat(3,1fr)}
  .whywrap{display:grid;grid-template-columns:.8fr 1fr;gap:50px;align-items:start}
  .whywrap .sh{position:sticky;top:110px}
  .stack{margin-top:0;max-width:600px}
  .sk{height:126px;margin-bottom:-30px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ln>span{transform:none}.sl,.lead,.cta,.mm{opacity:1}}
</style>
</head>
<body>

<header class="top" id="hdr">
  <a class="logo" href="#top"><img src="Logo.png" alt="2B SPARK"></a>
  <nav class="nav"><a href="#top" data-i18n="nav_home"></a><a href="#products" data-i18n="nav_prod"></a><a href="#why" data-i18n="nav_why"></a><a href="#contact" data-i18n="nav_contact"></a></nav>
  <div class="hr">
    <div class="lang" id="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="hi">हिं</button><button data-l="mr">मरा</button></div>
    <a class="hcall" href="tel:+919969569979"><span class="cn" data-i18n="callnow"></span><span class="cd">&#9742; 9969569979</span></a>
  </div>
</header>

<div class="ltoast" id="ltoast"><span>Language / भाषा</span><button data-l="en">English</button><button data-l="hi">हिन्दी</button><button data-l="mr">मराठी</button></div>

<section class="hero" id="top">
  <div class="blob"></div>
  <div class="hero-in">

function buildBulb(kind){

  let map=null;

  g.add(new THREE.Mesh(new THREE.LatheGeometry(dpts,72),dm));

  const jx=dpts[0].x,jy=dpts[0].y;

    const led=new THREE.Mesh(new THREE.SphereGeometry(.05,12,12),new THREE.MeshBasicMaterial({color:0x35d07f}));led.position.set(0,1.9,1.31);g.add(led);

  const gr=new THREE.Mesh(new THREE.TorusGeometry(.62,.025,8,56),M.dark());gr.rotation.x=Math.PI/2;gr.position.y=-1.0;g.add(gr);
  const lo=new THREE.Mesh(new THREE.CylinderGeometry(.58,.6,.6,56),mt);lo.position.y=-1.3;g.add(lo);

}
function rrect(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s}

const faceMat=()=>new THREE.MeshPhysicalMaterial({color:0xfffdf4,roughness:.6,emissive:new THREE.Color(0xfff3cf),emissiveIntensity:1.2});

  const g=new THREE.Group(),glow=[],wm=Object.assign(M.white(),{side:THREE.DoubleSide});

    const pr=[V2(0,0),V2(1.95,0)].concat(arcPts(1.95,.22,.22,-90,0,8),arcPts(1.95,.33,.22,0,90,8),[V2(1.6,.55)]);

    const f=faceMat();const fm=new THREE.Mesh(new THREE.CylinderGeometry(1.58,1.58,.04,72),f);fm.position.y=.52;g.add(fm);glow.push({m:f,on:1.2,off:.02});
    [150,-30].forEach(a=>{const r=a*Math.PI/180,n=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.03,20),new THREE.MeshStandardMaterial({color:0xc9ced6,roughness:.5}));n.position.set(1.82*Math.cos(r),.56,-1.82*Math.sin(r));g.add(n)});
  }else{
    const b=new THREE.Mesh(new THREE.CylinderGeometry(1.95,1.95,.34,72),wm);b.position.y=.17;g.add(b);
    const fl=[V2(1.9,.34),V2(2.34,.34),V2(2.4,.355),V2(2.4,.395),V2(2.34,.41),V2(1.9,.41)];
    g.add(new THREE.Mesh(new THREE.LatheGeometry(fl,96),wm));
    const f=faceMat();const fm=new THREE.Mesh(new THREE.CylinderGeometry(1.92,1.92,.03,72),f);fm.position.y=.405;g.add(fm);glow.push({m:f,on:1.2,off:.02});

function buildSquare(kind){
  const g=new THREE.Group(),glow=[],w=M.white();
  if(kind==='plain'){

    const f=faceMat();g.add(slab(rrect(3.8,3.8,.14),.03,0,f,.45));glow.push({m:f,on:1.2,off:.02});
  }else if(kind==='lip'){
    g.add(slab(rrect(4.1,4.1,.2),.34,0,w,0));
    g.add(slab(rrect(4.7,4.7,.25),.06,.02,w,.34));
    const f=faceMat();g.add(slab(rrect(3.9,3.9,.12),.03,0,f,.43));glow.push({m:f,on:1.2,off:.02});
  }else{
    g.add(slab(rrect(4.5,4.5,.25),.2,.04,w,0));

const BUILD={syska:()=>buildBulb('syska'),c7:()=>buildBulb('c7'),rech:()=>buildBulb('rech'),round:()=>buildRound(false),rlip:()=>buildRound(true),sq:()=>buildSquare('plain'),sqlip:()=>buildSquare('lip'),twoin1:()=>buildSquare('two')};

  if(cur3){HOLD.remove(cur3.pv);cur3.pv.traverse(o=>{if(o.geometry)o.geometry.dispose()})}

function fit(){if(!GL)return;const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;R.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix()}

/* ============ SHOWCASE UI ============ */
const stage=document.getElementById('stage'),main=document.getElementById('main'),fan=document.getElementById('fan');
let curIdx=0,curFilter='all';
const ANG=[140,105,75,40];
const money=n=>'\u20B9 '+n;
function renderFan(){
  fan.innerHTML='';
  PRODUCTS.filter(p=>p.hero&&p.id!==curIdx).slice(0,4).forEach((p,k)=>{
    const a=ANG[k]*Math.PI/180,b=document.createElement('button');
    b.className='fi';b.setAttribute('aria-label',p.name);
    b.style.cssText=`--x:${Math.cos(a).toFixed(3)};--y:${(-Math.sin(a)).toFixed(3)};--d:${k*80}ms`;
    b.innerHTML=`<span class="th">${SNAP[p.model]?`<img src="${SNAP[p.model]}" alt="">`:'2B'}</span><em>${L(p.short)}</em>`;
    b.onclick=e=>{e.stopPropagation();selectProduct(p.id)};
    fan.appendChild(b);
  });
}
const tableHTML=p=>{
  const cls=p.rows[0].length===3?'c3':'c2';
  return `<div class="tbl"><div class="r h ${cls}">${p.head.map((h,k)=>`<span class="${k===p.head.length-1?'pr2':''}">${t(h)}</span>`).join('')}</div>
  ${p.rows.map(r=>`<div class="r ${cls}">${r.map((c,k)=>k===r.length-1?`<span class="pr2">${money(c)}</span>`:`<span>${L(c)}</span>`).join('')}</div>`).join('')}</div>`;
};
function renderDetail(){const el=document.getElementById('pname');if(el)el.textContent=PRODUCTS[curIdx].name}
function selectProduct(i){
  stage.classList.remove('open');main.classList.add('swap');
  setTimeout(()=>{
    curIdx=i;
    if(GL){setModel(PRODUCTS[i].model);applyGlow();vel=.06}
    renderFan();renderDetail();main.classList.remove('swap');
  },300);
}
if(GL){
  setModel(PRODUCTS[0].model);applyGlow();fit();addEventListener('resize',fit);
  let down=null,lx=0,ly=0;
  main.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};lx=e.clientX;ly=e.clientY;drag=true;main.setPointerCapture(e.pointerId)});
  main.addEventListener('pointermove',e=>{
    if(!down)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
    if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)down.moved=true;
    vel=dx*.014;rotY+=vel;
    if(e.pointerType==='mouse')rotX=Math.max(-.2,Math.min(1.1,rotX+dy*.006));
  });

  main.addEventListener('pointercancel',()=>{down=null;drag=false});
  stage.addEventListener('click',e=>{if(e.target===stage||e.target.classList.contains('glow')||e.target.classList.contains('ring'))stage.classList.remove('open')});
  new IntersectionObserver(es=>{vis=es[0].isIntersecting},{threshold:.05}).observe(stage);
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function loop(tm){
    requestAnimationFrame(loop);
    if(document.hidden||!vis)return;
    if(!drag){vel*=.94;rotY+=vel+(reduce?0:.0085)}
    HOLD.rotation.set(rotX,rotY,0);
    litAmt+=(litTarget-litAmt)*.08;applyGlow();
    if(cur3.map)cur3.map.offset.x=(tm*.00004)%1;
    HALO.material.color.setHSL(cur3.color?(tm*.00005)%1:.1,.9,cur3.color?.6:.75);
    R.render(SC,CAM);
  })(0);
  const lit=document.getElementById('lit');
  lit.onclick=()=>{litTarget=litTarget?0:1;lit.classList.toggle('on',!!litTarget)};
}else{
  main.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;font:800 3rem Manrope;color:#fff">2B</div>';
  document.getElementById('lit').style.display='none';document.querySelector('.plus').style.display='none';
}

/* ============ WHY: stacking cards (6 cards) ============ */
const COLS=['#0a1d44','#0e2d60','#10356e','#16478a','#1a5198','#1e5ba6'];
document.getElementById('stack').innerHTML=COLS.map((c,i)=>`<div class="sk" style="--i:${i}"><div class="ski" style="--c:${c}"><span class="n">${String(i+1).padStart(2,'0')}</span><div><h3 data-i18n="w${i}t"></h3><p data-i18n="w${i}x"></p></div></div></div>`).join('');
const skCards=[...document.querySelectorAll('.sk')];
let tick=false;
function updateStack(){
  tick=false;
  const hh=64+14,stuck=skCards.map((c,i)=>c.getBoundingClientRect().top<=hh+i*11+1);
  skCards.forEach((c,i)=>{
    let k=0;for(let j=i+1;j<skCards.length;j++)if(stuck[j])k++;
    const ski=c.firstElementChild;
    ski.style.transform=k?`scale(${1-Math.min(k,6)*.022})`:'';
    ski.style.filter=k?`brightness(${1-Math.min(k,6)*.09})`:'';
  });
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(updateStack)}},{passive:true});

/* ============ CATALOGUE ============ */
const pgrid=document.getElementById('pgrid');
function renderCat(f){
  curFilter=f;pgrid.innerHTML='';let n=0;
  PRODUCTS.forEach(p=>{
    if(f!=='all'&&p.cat!==f)return;
    const el=document.createElement('article');el.className='pc';el.style.setProperty('--i',n++);
    el.innerHTML=`<div class="pt"><span class="th pth">${SNAP[p.model]?`<img src="${SNAP[p.model]}" alt="${p.name}">`:'2B'}</span><div><small>${t(p.tag)}</small><h3>${p.name}</h3></div></div>${tableHTML(p)}${GL?`<button class="v360">${t('v360')}</button>`:''}`;
    const b=el.querySelector('.v360');
    if(b)b.onclick=()=>{document.getElementById('top').scrollIntoView({behavior:'smooth'});setTimeout(()=>selectProduct(p.id),450)};
    pgrid.appendChild(el);
  });
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));renderCat(b.dataset.f);
});

/* ============ CONTACT LINKS ============ */
function updateLinks(){
  const su=t('mail_su'),bd=t('mail_bd');
  document.querySelectorAll('a[data-gmail]').forEach(a=>{a.href=`https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bd)}`});
  document.querySelectorAll('[data-wa]').forEach(a=>{a.href='https://wa.me/'+a.dataset.wa+'?text='+encodeURIComponent(WA_MSG)});
}

/* ============ APPLY LANGUAGE ============ */
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  renderFan();renderDetail();renderCat(curFilter);updateLinks();
}
function setLang(l){
  LANG=l;try{localStorage.setItem('lang',l);localStorage.setItem('lang_seen','1')}catch(e){}
  applyLang();document.getElementById('ltoast').classList.remove('show');
}
document.querySelectorAll('#lang button,#ltoast button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
applyLang();
try{if(!localStorage.getItem('lang_seen')){
  setTimeout(()=>document.getElementById('ltoast').classList.add('show'),1800);
  setTimeout(()=>{document.getElementById('ltoast').classList.remove('show');localStorage.setItem('lang_seen','1')},11000);
}}catch(e){}

/* ============ REVEAL + HEADER ============ */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
const hdr=document.getElementById('hdr');
addEventListener('scroll',()=>hdr.classList.toggle('sc',scrollY>20),{passive:true});
updateStack();
</script>
